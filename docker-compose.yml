version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: katha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: katha
      POSTGRES_PASSWORD: katha_secret
      POSTGRES_DB: katha_dev
    ports:
      - '5432:5432'
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U katha -d katha_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: katha-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ./docker/redis/data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
